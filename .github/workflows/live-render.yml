name: Live data render check

# Builds the app, runs it against the REAL providers (FRED; Finnhub, Twelve Data and FRED API when their keys are set
# as repository secrets) and renders the Macro Desk, calendar and news pages on desktop and iPhone size.
# Prints what each page shows and uploads screenshots. Production itself is checked by service-verify.yml.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["web/scripts/render-live.cjs", ".github/workflows/live-render.yml"]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: treidify, POSTGRES_PASSWORD: treidify, POSTGRES_DB: treidify_live }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://treidify:treidify@localhost:5432/treidify_live
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run db:migrate
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start
        run: |
          (npx next start -p 3000 > server.log 2>&1 &)
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://localhost:3000/login && break; sleep 1; done
      - name: Render and report
        run: |
          echo "FRED key: $([ -n "$FRED_API_KEY" ] && echo yes || echo no) · Finnhub key: $([ -n "$FINNHUB_API_KEY" ] && echo yes || echo no)"
          node scripts/render-live.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: live-shots, path: web/live-shots, retention-days: 14 }
