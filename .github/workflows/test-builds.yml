# Downloadable test builds of the real Treidify app, with no Xcode needed on your Mac.
#   Treidify-Mac:    a DMG with the Mac version (Mac Catalyst build of the same app target)
#   Treidify-iPhone: an unsigned IPA. Sideloadly signs it with a free Apple ID (docs/INSTALL_TEST_BUILDS.md)
name: Test builds
on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/test-builds.yml"]
  workflow_dispatch:
jobs:
  mac-dmg:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest installed Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Build the Mac app
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build -project Treidify.xcodeproj -scheme Treidify -configuration Release \
            -destination "generic/platform=macOS,variant=Mac Catalyst" -derivedDataPath build/mac \
            CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION=${{ github.run_number }} | tail -5
      - name: Sign ad hoc and check it launches
        working-directory: ios
        run: |
          APP=build/mac/Build/Products/Release-maccatalyst/Treidify.app
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          lipo -archs "$APP/Contents/MacOS/Treidify"
          open "$APP"
          sleep 12
          pgrep -x Treidify >/dev/null && echo "Treidify is running" || { echo "::error::Treidify did not stay running"; exit 1; }
          mkdir -p shots && screencapture -x shots/mac-launch.png || true
          pkill -x Treidify || true
      - name: Package the DMG
        working-directory: ios
        run: |
          mkdir -p dmg
          cp -R build/mac/Build/Products/Release-maccatalyst/Treidify.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Treidify" -srcfolder dmg -ov -format UDZO "Treidify-Mac-build${{ github.run_number }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: Treidify-Mac-build${{ github.run_number }}
          path: ios/Treidify-Mac-build${{ github.run_number }}.dmg
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-launch-check
          path: ios/shots
          retention-days: 7

  iphone-ipa:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest installed Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Build the iPhone app (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build -project Treidify.xcodeproj -scheme Treidify -configuration Release \
            -destination generic/platform=iOS -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION=${{ github.run_number }} | tail -5
      - name: Package the IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/device/Build/Products/Release-iphoneos/Treidify.app Payload/
          zip -qry "Treidify-iPhone-build${{ github.run_number }}-unsigned.ipa" Payload
          ls -la *.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Treidify-iPhone-build${{ github.run_number }}
          path: ios/Treidify-iPhone-build${{ github.run_number }}-unsigned.ipa
          retention-days: 30
