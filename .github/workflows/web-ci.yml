# Web platform: typecheck, unit tests (incl. shared analytics vectors), production build, end-to-end tests.
name: Web CI
on:
  push:
    paths: ["web/**", "shared/**", ".github/workflows/web-ci.yml"]
  pull_request:
    paths: ["web/**", "shared/**", ".github/workflows/web-ci.yml"]
  workflow_dispatch:
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
