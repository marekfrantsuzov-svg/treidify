# Web platform: typecheck, unit tests (incl. shared analytics vectors), production build, end-to-end tests.
name: Web CI
on:
  push:
    paths: ["web/**", "shared/**", ".github/workflows/web-ci.yml"]
  pull_request:
    paths: ["web/**", "shared/**", ".github/workflows/web-ci.yml"]
  workflow_dispatch:
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: treidify
          POSTGRES_PASSWORD: treidify
          POSTGRES_DB: treidify_e2e
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://treidify:treidify@localhost:5432/treidify_e2e
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run db:migrate
      # Database tests (MetaApi sync with a scripted MetaApi: owner/investor rules, isolation, P&L; shared market cache).
      - run: npx vitest run --no-file-parallelism src/server/sync/sync.db.test.ts src/server/market/saved-copy.db.test.ts src/server/membership/membership.db.test.ts
      - run: npx playwright install --with-deps chromium
      # The journeys run against `next dev`, which compiles each route on its first visit. Compile the routes the
      # journeys use up front so a test's 5-second navigation waits measure the app, not the compiler.
      - name: Start the app and pre-compile routes
        run: |
          nohup npm run dev > /tmp/next-dev.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://localhost:3000/ && break; sleep 2; done
          for p in / /login /login/two-factor /signup /onboarding /app /app/journal /app/performance /app/accounts /app/coach /app/news /app/markets /app/ai-analysis /app/settings/profile /app/settings/plan /app/settings/security /api/auth/get-session /api/health; do
            curl -s -o /dev/null -m 120 -w "%{http_code} $p\n" "http://localhost:3000$p" || true
          done
      - run: npm run test:e2e
      - name: Print failure context (page snapshot at the moment a test failed)
        if: failure()
        run: find test-results -name error-context.md -print -exec cat {} \; || true
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
