[project]
name = "treidify-backend"
version = "0.1.0"
description = "Treidify backend: integrations, entitlements and deterministic analytics"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.28"]

[tool.pytest.ini_options]
testpaths = ["tests"]
