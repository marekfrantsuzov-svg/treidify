# XcodeGen spec. Regenerate the project with:  cd ios && xcodegen generate
name: Treidify
options:
  bundleIdPrefix: app.treidify
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # set your Apple Developer Team ID
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  TreidifyCore:
    path: Packages/TreidifyCore
targets:
  Treidify:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Treidify
    dependencies:
      - package: TreidifyCore
    info:
      path: Treidify/Resources/Info.plist
      properties:
        CFBundleDisplayName: Treidify
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.treidify.ios
        # iPhone and iPad; Mac Catalyst (the Mac test build) requires the iPad family.
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
  TreidifyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TreidifyTests]
    dependencies:
      - target: Treidify
      - package: TreidifyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.treidify.ios.tests
        GENERATE_INFOPLIST_FILE: YES
  TreidifyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TreidifyUITests]
    dependencies:
      - target: Treidify
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.treidify.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Treidify
schemes:
  Treidify:
    build:
      targets:
        Treidify: all
    test:
      gatherCoverageData: true
      targets:
        - TreidifyTests
        - TreidifyUITests
        - package: TreidifyCore/TreidifyCoreTests
